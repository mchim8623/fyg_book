name: Generate OPDS
on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'generate_opds.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate OPDS
        run: python generate_opds.py
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add opds.xml covers/
          git diff --staged --quiet || (git commit -m "Auto-generate OPDS [skip ci]" && git push)
